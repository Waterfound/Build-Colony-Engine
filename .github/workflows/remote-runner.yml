name: public-remote-conformance
on:
  push:
    branches: ['colony-run/**']
    paths: ['.build-colony/remote-intent.json']
permissions:
  contents: read
jobs:
  remote-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[attestation]'
      - name: Verify source-bound remote intent
        run: python -m build_colony.github_push_cli check-intent .build-colony/remote-intent.json
      - name: Execute bounded source-bound Work Package
        run: python -m build_colony.github_push_cli execute .build-colony/remote-intent.json --repo-root . --output-dir remote-output
      - name: Upload source-bound result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-colony-remote-${{ github.run_id }}-${{ github.run_attempt }}
          path: remote-output/
          if-no-files-found: error
          retention-days: 7
