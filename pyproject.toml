[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "build-colony"
version = "0.1.0"
description = "Deterministic coordination and source-bound runner engine"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Waterfound"}]
dependencies = []

[project.optional-dependencies]
attestation = ["cryptography>=46,<48"]

[project.scripts]
build-colony-github-push = "build_colony.github_push_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
